<html lang="en">

    <title>Phương Duy 💕 Ngọc Diệp</title>
    <script>
    // Mảng các biểu tượng trái tim xoay vòng
    const hearts = ["💕", "💖", "💘", "💝", "💞"];
    let i = 0;
    const baseTitle = " Trang web của tôi";

    // Hàm đổi trái tim trong title mỗi 1 giây
    setInterval(() => {
      document.title = "Phương Duy " + hearts[i % hearts.length] + " Ngọc Diệp";
      i++;
    }, 1000);
  </script>
